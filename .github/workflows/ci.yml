name: CI

on:
  push:
    branches: [ main, extend-tests ]
  pull_request:
    branches: [ main ]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check Style
        run: |
          clang-format --dry-run -Werror -i src/*.cpp src/*.hpp tests/*.cpp

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev libeigen-dev libyaml-cpp-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (Runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev libeigen-dev libyaml-cpp-dev

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Run Tests
        run: |
          chmod +x build/testsidemade
          cd build
          ctest --output-on-failure
